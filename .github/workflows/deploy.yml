name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows you to trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm" # or yarn if you switch back

      - name: Install dependencies 🔧
        run: npm ci

      - name: Build 🏗️
        run: npm run build
        env:
          NEXT_PUBLIC_OUTPUT: export
          # IMPORTANT: Add your Formspree ID here so the contact form works!
          NEXT_PUBLIC_FORMSPREE_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ID }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean: true # removes old files not in the new build
